name: Refresh events

# Every morning at 09:20 UTC — a little after 5am in New York, so the page a
# reader opens at breakfast was built after midnight's listings landed and
# says "last updated this morning" truthfully.
#
# The job is allowed to do nothing. Most days it will change a handful of
# rows; some days a source is down and fetch_events.py keeps yesterday's file
# rather than writing an empty one. Nothing is committed unless the tree
# actually changed AND the whole guard suite still passes on the new data,
# which is the point: this is the one process that edits the live site with
# nobody reading the diff.

on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:          # and a button, for when a source is added

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The parsing and filing assertions. Offline, so they run before the
      # network step and fail fast if a refactor broke the classifier.
      - name: Self-check the fetcher
        run: python3 fetch_events.py --selfcheck

      - name: Fetch the calendars
        run: python3 fetch_events.py

      - name: Rebuild the pages that carry them
        run: python3 build_help.py

      # The same 4,000 checks that run locally. A third party can put anything
      # in a title, so this is where a feed that starts emitting garbage gets
      # stopped — before it reaches the site, not after somebody notices.
      - name: Check
        run: python3 check.py

      - name: Commit if anything moved
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no change today"
            exit 0
          fi
          git config user.name  "waypoint-events[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json events.html help.html
          # Only those three. If a run somehow dirties a source file, that is a
          # bug to look at by hand, not something to push at 5am.
          git commit -m "Events: refresh from the public calendars

          Generated by .github/workflows/events.yml. Source data is
          data/events.json; both pages are rebuilt from it by build_help.py."
          git push
